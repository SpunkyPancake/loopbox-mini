<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Snippet Sampler</title>
<style>
  :root {
    --bg: #0e0e10;
    --card: #181818;
    --accent: #1db954;
    --text: #f5f5f5;
    --muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .wrap { width: 100%; max-width: 420px; }
  h1 { font-size: 20px; text-align: center; margin: 8px 0 20px; }
  button {
    font-family: inherit;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .primary { background: var(--accent); color: #000; width: 100%; }
  .secondary { background: #2a2a2a; color: var(--text); }
  .row { display: flex; gap: 8px; margin: 8px 0; }
  .row button { flex: 1; }
  input[type="text"] {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #1c1c1c;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 10px;
  }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 18px;
    margin-top: 16px;
    text-align: center;
  }
  .track-name { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
  .track-artist { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .track-source { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: -10px; margin-bottom: 14px; }
  .status { text-align: center; color: var(--muted); font-size: 13px; margin-top: 10px; min-height: 16px; }
  .like-btn.liked { background: var(--accent); color: #000; }
  hr { border: none; border-top: 1px solid #262626; margin: 20px 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎧 Snippet Sampler</h1>

  <div id="loginView">
    <button class="primary" id="loginBtn">Log in with Spotify</button>
    <p class="status">You'll need Spotify Premium open on this phone for playback to work.</p>
  </div>

  <div id="appView" class="hidden">
    <button class="primary" id="searchBtn">🎲 Surprise me</button>
    <div id="status" class="status"></div>

    <div id="player" class="card hidden">
      <div class="track-name" id="trackName">—</div>
      <div class="track-artist" id="trackArtist">—</div>
      <div class="track-source" id="trackSource"></div>

      <div class="row">
        <button class="secondary" id="playBtn">▶ Play</button>
        <button class="secondary" id="pauseBtn">⏸ Pause</button>
      </div>
      <hr>

      <div class="row">
        <button class="secondary" id="skipBackwardBtn">⏪ Rewind 5s</button>
        <button class="secondary" id="skipForwardBtn">⏩ Skip 5s</button>
      </div>

      <hr>

      <div class="row">
        <button class="secondary like-btn" id="likeBtn">♡ Like</button>
        <button class="primary" id="skipBtn">Next ›</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ====== CONFIG — fill these in ====== */
const CLIENT_ID = "26a9bb73abf54958acb4a5b96165859d";
const REDIRECT_URI = window.location.origin + window.location.pathname; // must exactly match what you set in the Spotify dashboard
const LIKED_PLAYLIST_NAME = "Snippet Sampler Likes";
const DEFAULT_SNIPPET_MS = 10000;
const START_WINDOW_MS = 60000; // random start point is chosen from the first minute of the track
const SKIP_MS = 5000;
const SERIALIZE_SEARCH_REQUESTS = false; // testing: one search request at a time instead of parallel bursts. Set to false to roll back.
/* ===================================== */

const SCOPES = [
  "user-read-playback-state",
  "user-modify-playback-state",
  "user-read-private",
  "playlist-modify-public",
  "playlist-modify-private"
].join(" ");

const els = {
  loginView: document.getElementById("loginView"),
  appView: document.getElementById("appView"),
  loginBtn: document.getElementById("loginBtn"),
  searchBtn: document.getElementById("searchBtn"),
  status: document.getElementById("status"),
  player: document.getElementById("player"),
  trackName: document.getElementById("trackName"),
  trackArtist: document.getElementById("trackArtist"),
  trackSource: document.getElementById("trackSource"),
  playBtn: document.getElementById("playBtn"),
  pauseBtn: document.getElementById("pauseBtn"),
  skipBackwardBtn: document.getElementById("skipBackwardBtn"),
  skipForwardBtn: document.getElementById("skipForwardBtn"),
  likeBtn: document.getElementById("likeBtn"),
  skipBtn: document.getElementById("skipBtn"),
};

let state = {
  accessToken: null,
  queue: [],
  index: -1,
  deviceId: null,
  markStart: null,
  markEnd: null,
  likedPlaylistId: null,
};

// ---------- PKCE auth helpers ----------
function base64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function sha256(text) {
  return await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
}
function randomString(len = 64) {
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return base64url(arr).slice(0, len);
}

async function login() {
  const verifier = randomString();
  localStorage.setItem("pkce_verifier", verifier);
  const oauthState = randomString(32);
  localStorage.setItem("oauth_state", oauthState);
  const challenge = base64url(await sha256(verifier));
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: "code",
    redirect_uri: REDIRECT_URI,
    code_challenge_method: "S256",
    code_challenge: challenge,
    scope: SCOPES,
    state: oauthState,
  });
  window.location = "https://accounts.spotify.com/authorize?" + params.toString();
}

async function exchangeCodeForToken(code) {
  const verifier = localStorage.getItem("pkce_verifier");
  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: "authorization_code",
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier,
  });
  const res = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body,
  });
  const data = await res.json();
  if (data.access_token) {
    localStorage.setItem("access_token", data.access_token);
    localStorage.setItem("refresh_token", data.refresh_token);
    localStorage.setItem("expires_at", Date.now() + data.expires_in * 1000);
    state.accessToken = data.access_token;
  }
}

async function refreshToken() {
  const refresh = localStorage.getItem("refresh_token");
  if (!refresh) return false;
  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: "refresh_token",
    refresh_token: refresh,
  });
  const res = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body,
  });
  const data = await res.json();
  if (data.access_token) {
    localStorage.setItem("access_token", data.access_token);
    localStorage.setItem("expires_at", Date.now() + data.expires_in * 1000);
    if (data.refresh_token) localStorage.setItem("refresh_token", data.refresh_token);
    state.accessToken = data.access_token;
    return true;
  }
  return false;
}

// ---------- API wrapper ----------
let refreshPromise = null;
async function ensureFreshToken() {
  if (Date.now() <= Number(localStorage.getItem("expires_at") || 0)) return;
  if (!refreshPromise) {
    refreshPromise = refreshToken().finally(() => { refreshPromise = null; });
  }
  await refreshPromise;
}

async function api(path, opts = {}, retryCount = 0) {
  await ensureFreshToken();
  const res = await fetch("https://api.spotify.com/v1" + path, {
    ...opts,
    headers: {
      Authorization: "Bearer " + state.accessToken,
      "Content-Type": "application/json",
      ...(opts.headers || {}),
    },
  });
  if (res.status === 429) {
    const retryAfter = Number(res.headers.get("Retry-After") || 1);
    if (retryCount < 3) {
      await new Promise(r => setTimeout(r, (retryAfter + 0.5) * 1000));
      return api(path, opts, retryCount + 1);
    }
    throw new Error(`429: rate limited, Spotify says wait ${retryAfter}s (gave up after 3 retries)`);
  }
  if (res.status === 204 || res.status === 202) return null;
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) {
    const msg = data?.error?.message || res.statusText || `HTTP ${res.status}`;
    throw new Error(`${res.status}: ${msg}`);
  }
  return data;
}

// ---------- App logic ----------
function saveMarks() {
  const track = state.queue[state.index];
  if (!track) return;
  const marks = JSON.parse(localStorage.getItem("snippet_marks") || "{}");
  marks[track.id] = { start: state.markStart, end: state.markEnd };
  localStorage.setItem("snippet_marks", JSON.stringify(marks));
}
function loadMarks(trackId) {
  const marks = JSON.parse(localStorage.getItem("snippet_marks") || "{}");
  return marks[trackId] || null;
}

async function getActiveDevice() {
  const data = await api("/me/player/devices");
  if (!data || !data.devices.length) {
    els.status.textContent = "No active Spotify device found. Open the Spotify app on this phone first, then try again.";
    return null;
  }
  const dev = data.devices.find(d => d.is_active) || data.devices[0];
  state.deviceId = dev.id;
  return dev.id;
}

const RANDOM_CHARS = "abcdefghijklmnopqrstuvwxyz".split("");
const QUEUE_TARGET = 20;
const LOW_THRESHOLD = 5;
const TRICKLE_INTERVAL_MS = 15000;

function randomQuery() {
  const a = RANDOM_CHARS[Math.floor(Math.random() * RANDOM_CHARS.length)];
  const b = RANDOM_CHARS[Math.floor(Math.random() * RANDOM_CHARS.length)];
  return a + b;
}

async function fetchRandomTracks(queryCount = 6, source = "search") {
  const queries = Array.from({ length: queryCount }, randomQuery);
  const runQuery = q => api(`/search?q=${encodeURIComponent(q)}&type=track&limit=10&offset=${Math.floor(Math.random() * 200)}`);
  let results;
  if (SERIALIZE_SEARCH_REQUESTS) {
    results = [];
    for (const q of queries) {
      results.push(await runQuery(q));
    }
  } else {
    results = await Promise.all(queries.map(runQuery));
  }
  const seen = new Set();
  const tracks = [];
  for (const data of results) {
    for (const t of (data?.tracks?.items || [])) {
      if (t && t.id && !seen.has(t.id)) { seen.add(t.id); tracks.push(t); }
    }
  }
  for (let i = tracks.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [tracks[i], tracks[j]] = [tracks[j], tracks[i]];
  }
  for (const t of tracks) t._source = source;
  return tracks;
}

// Fetches more random tracks in the background and appends them to the
// live queue, so new songs keep turning up while earlier ones are still
// playing instead of everything being decided up front.
let topUpPromise = null;
function topUpQueue(queryCount = 6) {
  if (!topUpPromise) {
    topUpPromise = fetchRandomTracks(queryCount, "background")
      .then(tracks => {
        const existingIds = new Set(state.queue.map(t => t.id));
        state.queue.push(...tracks.filter(t => !existingIds.has(t.id)));
      })
      .catch(err => console.error("Background top-up failed:", err))
      .finally(() => { topUpPromise = null; });
  }
  return topUpPromise;
}

// Gently tops the queue back up to QUEUE_TARGET with one search request
// every TRICKLE_INTERVAL_MS, instead of bursts of parallel requests.
let trickleTimer = null;
function startTrickle() {
  if (trickleTimer) return;
  trickleTimer = setInterval(() => {
    if (state.queue.length - state.index < QUEUE_TARGET) {
      topUpQueue(1);
    }
  }, TRICKLE_INTERVAL_MS);
}

async function loadRandomQueue() {
  els.status.textContent = "Finding random songs…";
  let tracks;
  try {
    tracks = await fetchRandomTracks();
  } catch (err) {
    els.status.textContent = `Search failed: ${err.message}`;
    return;
  }
  if (!tracks.length) {
    els.status.textContent = "Couldn't find any tracks — try again.";
    return;
  }
  state.queue = tracks.slice(0, QUEUE_TARGET);
  state.index = -1;
  els.status.textContent = `Loaded ${state.queue.length} random tracks.`;
  els.player.classList.remove("hidden");
  startTrickle();
  await nextTrack();
}

async function nextTrack() {
  state.index++;

  if (state.queue.length - state.index <= LOW_THRESHOLD) {
    topUpQueue(6); // fire-and-forget: faster catch-up when running low
  }
  if (state.index >= state.queue.length) {
    els.status.textContent = "Finding more random songs…";
    await topUpQueue(6);
  }
  if (state.index >= state.queue.length) {
    els.status.textContent = "Couldn't find more tracks — tap Surprise me to retry.";
    els.player.classList.add("hidden");
    return;
  }

  const track = state.queue[state.index];
  els.trackName.textContent = track.name;
  els.trackArtist.textContent = track.artists.map(a => a.name).join(", ");
  els.trackSource.textContent = track._source === "background" ? "🌑 shot in the dark" : "🔍 semi-random search";

  const saved = loadMarks(track.id);
  if (saved && saved.start != null) {
    state.markStart = saved.start;
    state.markEnd = saved.end;
  } else {
    const duration = track.duration_ms || 0;
    const maxStart = Math.max(Math.min(START_WINDOW_MS, duration - DEFAULT_SNIPPET_MS), 0);
    state.markStart = Math.floor(Math.random() * (maxStart + 1));
    state.markEnd = state.markStart + DEFAULT_SNIPPET_MS;
  }
  saveMarks();
  els.likeBtn.classList.remove("liked");
  els.likeBtn.textContent = "♡ Like";

  const deviceId = state.deviceId || await getActiveDevice();
  if (!deviceId) return;
  await api(`/me/player/play?device_id=${deviceId}`, {
    method: "PUT",
    body: JSON.stringify({ uris: [track.uri], position_ms: state.markStart || 0 }),
  });
}

async function skipForward() {
  const deviceId = state.deviceId || await getActiveDevice();
  const p = await api("/me/player");
  if (p && p.progress_ms != null) {
    await api(`/me/player/seek?position_ms=${p.progress_ms + SKIP_MS}&device_id=${deviceId}`, { method: "PUT" });
  }
}

async function skipBackward() {
  const deviceId = state.deviceId || await getActiveDevice();
  const p = await api("/me/player");
  if (p && p.progress_ms != null) {
    await api(`/me/player/seek?position_ms=${Math.max(p.progress_ms - SKIP_MS, 0)}&device_id=${deviceId}`, { method: "PUT" });
  }
}

async function ensureLikedPlaylist() {
  if (state.likedPlaylistId) return state.likedPlaylistId;
  const stored = localStorage.getItem("liked_playlist_id");
  if (stored) {
    try {
      await api(`/playlists/${stored}`);
      state.likedPlaylistId = stored;
      return stored;
    } catch (err) {
      localStorage.removeItem("liked_playlist_id");
    }
  }
  const me = await api("/me");
  const lists = await api(`/me/playlists?limit=50`);
  const existing = lists?.items?.find(p => p.name === LIKED_PLAYLIST_NAME);
  if (existing) {
    state.likedPlaylistId = existing.id;
  } else {
    const created = await api(`/users/${me.id}/playlists`, {
      method: "POST",
      body: JSON.stringify({ name: LIKED_PLAYLIST_NAME, public: false, description: "Songs liked in Snippet Sampler" }),
    });
    state.likedPlaylistId = created.id;
  }
  localStorage.setItem("liked_playlist_id", state.likedPlaylistId);
  return state.likedPlaylistId;
}

async function likeTrack() {
  const track = state.queue[state.index];
  if (!track) return;
  try {
    const playlistId = await ensureLikedPlaylist();
    await api(`/playlists/${playlistId}/tracks`, {
      method: "POST",
      body: JSON.stringify({ uris: [track.uri] }),
    });
  } catch (err) {
    els.status.textContent = `Like failed: ${err.message}`;
    return;
  }
  els.likeBtn.classList.add("liked");
  els.likeBtn.textContent = "♥ Liked";
}

// ---------- Wire up UI ----------
els.loginBtn.addEventListener("click", login);
els.searchBtn.addEventListener("click", loadRandomQueue);
els.playBtn.addEventListener("click", async () => {
  const d = state.deviceId || await getActiveDevice();
  await api(`/me/player/play?device_id=${d}`, { method: "PUT" });
});
els.pauseBtn.addEventListener("click", async () => {
  await api(`/me/player/pause?device_id=${state.deviceId}`, { method: "PUT" });
});
els.skipBackwardBtn.addEventListener("click", skipBackward);
els.skipForwardBtn.addEventListener("click", skipForward);
els.likeBtn.addEventListener("click", likeTrack);
els.skipBtn.addEventListener("click", nextTrack);

// ---------- Boot ----------
(async function init() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const returnedState = params.get("state");
  const stored = localStorage.getItem("access_token");

  if (code) {
    const expectedState = localStorage.getItem("oauth_state");
    localStorage.removeItem("oauth_state");
    if (!expectedState || returnedState !== expectedState) {
      alert("Login failed: security check did not match. Please try logging in again.");
      window.history.replaceState({}, document.title, window.location.pathname);
      return;
    }
    await exchangeCodeForToken(code);
    window.history.replaceState({}, document.title, window.location.pathname);
  } else if (stored) {
    state.accessToken = stored;
  }

  if (state.accessToken) {
    els.loginView.classList.add("hidden");
    els.appView.classList.remove("hidden");
    await getActiveDevice();
  }
})();
</script>
</body>
</html>
